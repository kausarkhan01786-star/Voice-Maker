[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[[redirects]]
  from = "/api/tts"
  to = "/.netlify/functions/tts"
  status = 200
  force = true

[[redirects]]
  from = "/api/guide-ask"
  to = "/.netlify/functions/guide-ask"
  status = 200
  force = true

[[redirects]]
  from = "/api/music"
  to = "/.netlify/functions/music"
  status = 200
  force = true

[[redirects]]
  from = "/api/audio-to-video"
  to = "/.netlify/functions/audio-to-video"
  status = 200
  force = true

